<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Exportar miniaturas — Catálogo 3D</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10131d;
      --panel: #191e2d;
      --border: #2a3247;
      --text: #eff3ff;
      --muted: #9daac3;
      --accent: #bbfc70;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top left, #25324766, transparent 50%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }
    .card {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px;
    }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; line-height: 1.6; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; }
    .field select, .field input {
      background: #0d1018;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #16200f;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: filter .15s, transform .08s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #progress {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      white-space: pre-line;
      min-height: 20px;
    }
    #preview {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    #preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #0d1018;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Exportar miniaturas</h1>
    <p class="sub">
      Genera un PNG por cada objeto del catálogo y los empaqueta en un ZIP.
      Usalo una sola vez y descomprimí el resultado dentro de
      <code>inventory/items/thumbs/</code>.
    </p>

    <div class="field">
      <label for="size">Tamaño de cada PNG</label>
      <select id="size">
        <option value="128">128 × 128</option>
        <option value="256" selected>256 × 256 (recomendado)</option>
        <option value="512">512 × 512</option>
      </select>
    </div>

    <div class="field">
      <label for="bg">Fondo</label>
      <select id="bg">
        <option value="transparent" selected>Transparente (recomendado)</option>
        <option value="dark">Oscuro con degradado</option>
      </select>
    </div>

    <button id="export">Generar y descargar ZIP</button>
    <div id="progress">Esperando…</div>

    <div id="preview"></div>
  </div>

  <!-- JSZip para empaquetar -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script type="module">
    import * as THREE from "three";
    import { catalogo, crearObjeto } from "./catalogo.js";

    const $ = (id) => document.getElementById(id);
    const progress = $("progress");

    async function generate() {
      const size = parseInt($("size").value, 10);
      const bg = $("bg").value;

      $("export").disabled = true;
      $("preview").innerHTML = "";
      progress.textContent = "Preparando renderer…";

      // --- Renderer offscreen ---
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: bg === "transparent",
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(size, size, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      if (bg === "transparent") {
        renderer.setClearColor(0x000000, 0);
      } else {
        // Degradado oscuro como el visor (vía fondo de escena)
        const canvasBg = document.createElement("canvas");
        canvasBg.width = canvasBg.height = size;
        const ctx = canvasBg.getContext("2d");
        const grd = ctx.createRadialGradient(
          size / 2, size / 2, 0,
          size / 2, size / 2, size / 2
        );
        grd.addColorStop(0, "#35445d");
        grd.addColorStop(1, "#10131d");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, size, size);
        const bgTex = new THREE.CanvasTexture(canvasBg);
        bgTex.colorSpace = THREE.SRGBColorSpace;
        renderer.setClearColor(0x000000, 0);
        // Usamos un plano de fondo gigante atrás de todo
        const bgScene = new THREE.Scene();
        bgScene.background = bgTex;
        renderer.autoClear = false;
        // Guardamos para después
        renderer.__bgScene = bgScene;
      }

      // --- Escena y luces ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);

      scene.add(new THREE.HemisphereLight(0xdfefff, 0x44405d, 2.5));
      const key = new THREE.DirectionalLight(0xffedce, 4);
      key.position.set(4, 6, 7);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x91bfff, 2.2);
      fill.position.set(-5, 2, 3);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xc6a0ff, 3);
      rim.position.set(2, 4, -5);
      scene.add(rim);

      // Cámara en la misma posición que el visor
      camera.position.set(3.5, 2.25, 5.2);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();

      // --- ZIP ---
      const zip = new JSZip();

      // --- Procesar cada objeto ---
      for (let i = 0; i < catalogo.length; i++) {
        const item = catalogo[i];
        progress.textContent = `Renderizando ${i + 1}/${catalogo.length}: ${item.nombre}`;

        const model = crearObjeto(item.id);
        scene.add(model);

        // Render
        if (renderer.__bgScene) renderer.render(renderer.__bgScene, camera);
        renderer.render(scene, camera);

        // Data URL → blob
        const dataURL = renderer.domElement.toDataURL("image/png");
        const base64 = dataURL.split(",")[1];
        zip.file(`${item.id}.png`, base64, { base64: true });

        // Preview en el DOM (solo visual)
        const img = document.createElement("img");
        img.src = dataURL;
        img.alt = item.nombre;
        $("preview").appendChild(img);

        // Cleanup del modelo
        scene.remove(model);
        model.traverse((node) => {
          if (node.geometry) node.geometry.dispose();
          if (node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((m) => m.dispose());
          }
        });

        // Ceder al navegador
        await new Promise((r) => requestAnimationFrame(r));
      }

      progress.textContent = `Empaquetando ZIP… (${catalogo.length} archivos)`;
      const blob = await zip.generateAsync({ type: "blob" });

      // Descarga
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "thumbs.zip";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);

      progress.textContent =
        `✅ Listo. Se descargó thumbs.zip con ${catalogo.length} PNGs de ${size}×${size}.\n` +
        `Descomprimilo dentro de inventory/items/thumbs/.`;

      $("export").disabled = false;

      // Limpieza del renderer
      renderer.dispose();
    }

    $("export").addEventListener("click", () => {
      generate().catch((err) => {
        console.error(err);
        progress.textContent = "❌ Error: " + err.message;
        $("export").disabled = false;
      });
    });
  </script>
</body>
</html>
